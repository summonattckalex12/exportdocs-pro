services:
  excportcuy:
    build: .
    container_name: excportcuy
    ports:
      - "9812:9812"
    environment:
      NODE_ENV: production
      PORT: "9812"
      HOST: "0.0.0.0"
      # Kalau nanti pakai MySQL, uncomment baris di bawah:
      # DATABASE_URL: "mysql://excport:excport@db:3306/excportcuy"
    volumes:
      - ./data/uploads:/app/data/uploads
    restart: unless-stopped
    # depends_on:
    #   - db

  # === Optional: MySQL lokal ===
  # Aktifkan dengan menghapus tanda komentar di bawah + di service excportcuy.
  # Data disimpan di ./data/mysql (bind mount lokal, bukan volume Docker).
  #
  # db:
  #   image: mysql:8.4
  #   container_name: excportcuy-db
  #   restart: unless-stopped
